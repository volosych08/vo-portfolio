services:
  caddy:
    image: caddy:2
    container_name: itdp-volosych08-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itdp-volosych08-app-prod
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: itdp
      DB_USERNAME: vovaAdmin
      DB_PASSWORD: 1710
    volumes:
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: itdp-volosych08-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1710
      MYSQL_DATABASE: itdp
      MYSQL_USER: vovaAdmin
      MYSQL_PASSWORD: 1710
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1710"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
    name: itdp-volosych08_caddy_data
  caddy_config:
    name: itdp-volosych08_caddy_config
  mysql_data:
    name: itdp-volosych08_mysql_data
  uploads_data:
    name: itdp-volosych08_uploads_data
